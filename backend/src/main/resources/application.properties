# ---------------------------------------------------------------------------
# Newspaper settings, layer 1 (code defaults). Layer 2 comes from environment
# variables (PRESSERL_NEWSPAPER_NAME -> presserl.newspaper.name), layer 3 from the
# newspaper row in the database. Defaults live in NewspaperConfig (@WithDefault).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Database: reactive datasource for the application, JDBC datasource only for Flyway
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
# JSON columns use Hibernate's own Jackson mapper, independent of the REST ObjectMapper
quarkus.hibernate-orm.mapping.format.global=ignore

%prod.quarkus.datasource.username=${presserl.db.username:presserl}
%prod.quarkus.datasource.password=${presserl.db.password}
%prod.quarkus.datasource.reactive.url=postgresql://${presserl.db.host:postgres}:${presserl.db.port:5432}/${presserl.db.name:presserl}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${presserl.db.host:postgres}:${presserl.db.port:5432}/${presserl.db.name:presserl}

# ---------------------------------------------------------------------------
# HTTP: always behind a TLS-terminating reverse proxy in production
# ---------------------------------------------------------------------------
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# Admin dev server (Gradle, localhost:8081) calls the backend cross-origin in development only
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:8081

# ---------------------------------------------------------------------------
# OIDC: bearer tokens for /api issued by the operator's Keycloak
# ---------------------------------------------------------------------------
quarkus.oidc.application-type=service
quarkus.oidc.client-id=presserl-backend
quarkus.oidc.token.audience=presserl-backend
# Only locally verified JWTs; the backend client has no introspection rights
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
%prod.quarkus.oidc.auth-server-url=${presserl.oidc.issuer}

# The issuer the backend validates against and advertises to the admin app.
# In dev/test Keycloak Dev Services set quarkus.oidc.auth-server-url.
%dev,test.presserl.oidc.issuer=${quarkus.oidc.auth-server-url}
presserl.oidc.admin-client-id=presserl-admin
%dev,test.presserl.oidc.backend-secret=presserl-dev-secret
%dev,test.presserl.oidc.reader-secret=presserl-reader-dev-secret

quarkus.http.auth.permission.public-api.paths=/api/newspaper,/api/client-config
quarkus.http.auth.permission.public-api.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# ---------------------------------------------------------------------------
# OIDC tenant "reader": authorization code flow for the server-rendered reader only.
# The session lives in an encrypted cookie; /api never accepts it (ReaderTenantScope pins every
# path outside tenant-paths to the default tenant).
# Access to a private newspaper is decided per request in ReaderResource, so only /login
# is protected statically. Add future reader paths to tenant-paths.
# ---------------------------------------------------------------------------
quarkus.oidc.reader.application-type=web-app
quarkus.oidc.reader.auth-server-url=${presserl.oidc.issuer}
quarkus.oidc.reader.client-id=${presserl.oidc.reader-client-id:presserl-reader}
quarkus.oidc.reader.credentials.secret=${presserl.oidc.reader-secret}
quarkus.oidc.reader.tenant-paths=/,/login,/logout,/articles/*
quarkus.oidc.reader.authentication.pkce-required=true
quarkus.oidc.reader.authentication.restore-path-after-redirect=true
quarkus.oidc.reader.authentication.cookie-path=/
quarkus.oidc.reader.authentication.cookie-same-site=lax
%prod.quarkus.oidc.reader.authentication.cookie-force-secure=true
quarkus.oidc.reader.authentication.session-expired-path=/
quarkus.oidc.reader.token.refresh-expired=true
quarkus.oidc.reader.logout.path=/logout
quarkus.oidc.reader.logout.post-logout-path=/

quarkus.http.auth.permission.reader-login.paths=/login
quarkus.http.auth.permission.reader-login.policy=authenticated

# Keycloak Dev Services: dev realm with fixed secret and dev-only clients
quarkus.keycloak.devservices.realm-path=dev/presserl-realm.json
quarkus.keycloak.devservices.realm-name=presserl
%dev.quarkus.keycloak.devservices.port=8180

# The Keycloak Admin client is built programmatically from the issuer (see KeycloakAdminProducer)
quarkus.keycloak.admin-client.enabled=false

# ---------------------------------------------------------------------------
# Publisher bootstrap: mandatory in production, defaults for dev and test
# ---------------------------------------------------------------------------
%dev,test.presserl.publisher.username=publisher
%dev,test.presserl.publisher.password=publisher

# ---------------------------------------------------------------------------
# OpenAPI and health
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Presserl API
quarkus.swagger-ui.always-include=false
