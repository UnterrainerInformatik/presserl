<header class="masthead">
  {#if linked}
  <p class="masthead__name"><a href="/">{name}</a></p>
  {#else}
  <h1 class="masthead__name">{name}</h1>
  {/if}
  {#if subtitle}
  <p class="masthead__subtitle">{subtitle}</p>
  {/if}
  {#if viewerName}
  <p class="masthead__viewer">{msg:loggedInAs(viewerName)} · <a href="/logout">{msg:logout}</a></p>
  {/if}
</header>
