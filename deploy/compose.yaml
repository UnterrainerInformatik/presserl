# Presserl reference deployment: the Presserl image, PostgreSQL, RustFS (S3-compatible store for
# uploaded images) and LanguageTool (German spell check) - nothing else. Keycloak and the
# TLS-terminating reverse proxy are provided by the operator (see INSTALL.md). RustFS and
# LanguageTool publish no port: only presserl reaches them. presserl does not wait for LanguageTool;
# until it is up, spell checks answer 503 and everything else works.
name: presserl

services:
  presserl:
    image: ${PRESSERL_IMAGE:-gufalcon/presserl:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PRESSERL_DB_HOST: postgres
      PRESSERL_MEDIA_S3_ENDPOINT: ${PRESSERL_MEDIA_S3_ENDPOINT:-http://rustfs:9000}
    ports:
      - "${PRESSERL_HTTP_PORT:-8080}:8080"
    volumes:
      # The newspaper's theme (custom.css, fonts, images), served at /theme/ - see theme/README.md
      - ./theme:/deployments/theme:ro
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # Ready = database migrated, the first publisher exists in Keycloak and the media bucket is reachable
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: presserl
      POSTGRES_USER: presserl
      POSTGRES_PASSWORD: ${PRESSERL_DB_PASSWORD:?PRESSERL_DB_PASSWORD must be set in .env}
    volumes:
      - presserl-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presserl -d presserl"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${PRESSERL_MEDIA_S3_ACCESS_KEY:?PRESSERL_MEDIA_S3_ACCESS_KEY must be set in .env}
      RUSTFS_SECRET_KEY: ${PRESSERL_MEDIA_S3_SECRET_KEY:?PRESSERL_MEDIA_S3_SECRET_KEY must be set in .env}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - presserl-media:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  languagetool:
    image: erikvl87/languagetool:6.8
    restart: unless-stopped
    environment:
      # Heap of the checker; the container takes about 1 GB RAM (see INSTALL.md)
      Java_Xms: 256m
      Java_Xmx: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8010/v2/languages"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  presserl-db:
  presserl-media:
