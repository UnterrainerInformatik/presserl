<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="885px" preserveAspectRatio="none" style="width:943px;height:885px;background:#FFFFFF;" version="1.1" viewBox="0 0 943 885" width="943px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Sans-Serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="206.1035" x="365.1989" y="22.9951">Presserl - Article Lifecycle</text></g><g class="entity" data-qualified-name="Submitted" data-source-line="22" id="ent0001"><rect fill="#F1F1F1" height="85.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="320.3643" x="292.75" y="287.6869"/><line style="stroke:#181818;stroke-width:0.5;" x1="292.75" x2="613.1143" y1="313.9838" y2="313.9838"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="72.6523" x="416.606" y="305.682">Submitted</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="254.9463" x="297.75" y="331.9789">never published, waits for one level:</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="300.3643" x="297.75" y="348.2757">section editor &#8594; editor-in-chief &#8594; publisher</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="198.8096" x="297.75" y="364.5726">content frozen while waiting</text></g><g class="entity" data-qualified-name="Published" data-source-line="25" id="ent0002"><rect fill="#F1F1F1" height="85.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="324.4316" x="165.71" y="464.8769"/><line style="stroke:#181818;stroke-width:0.5;" x1="165.71" x2="490.1416" y1="491.1737" y2="491.1737"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="67.6484" x="294.1016" y="482.872">Published</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="274.0117" x="170.71" y="509.1689">Edits create a new revision; submitting</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="304.4316" x="170.71" y="525.4657">them keeps the status and the live revision</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="284.5938" x="170.71" y="541.7626">until the chain approves (pending level).</text></g><g class="entity" data-qualified-name="Offline" data-source-line="28" id="ent0003"><rect fill="#F1F1F1" height="68.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="289.2197" x="183.32" y="802.9569"/><line style="stroke:#181818;stroke-width:0.5;" x1="183.32" x2="472.5397" y1="829.2538" y2="829.2538"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="46.1426" x="304.8586" y="820.952">Offline</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="269.2197" x="188.32" y="847.2489">Back online is submitted like changes;</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="263.0264" x="188.32" y="863.5457">the status stays Offline while it waits.</text></g><g class="entity" data-qualified-name="Locked" data-source-line="30" id="ent0004"><rect fill="#F1F1F1" height="68.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="184.6436" x="235.61" y="642.0669"/><line style="stroke:#181818;stroke-width:0.5;" x1="235.61" x2="420.2536" y1="668.3638" y2="668.3638"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="49.6699" x="303.0968" y="660.062">Locked</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="164.6436" x="240.61" y="686.3589">offline, only a publisher</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="94.7871" x="240.61" y="702.6557">can release it</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="6" id="ent0005"><ellipse cx="452.93" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="427.93" y="147.9869"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="35.5332" x="435.1634" y="172.8336">Draft</text><g class="end_entity" data-qualified-name=".end." data-source-line="14" id="ent0014"><ellipse cx="605.93" cy="507.4769" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="605.93" cy="507.4769" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN21" data-source-line="34" id="ent0022"><path d="M512.67,140.2969 L512.67,163.9869 L478.07,167.9869 L512.67,171.9869 L512.67,195.6953 A0,0 0 0 0 512.67,195.6953 L783.1964,195.6953 A0,0 0 0 0 783.1964,195.6953 L783.1964,150.2969 L773.1964,140.2969 L512.67,140.2969 A0,0 0 0 0 512.67,140.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M773.1964,140.2969 L773.1964,150.2969 L783.1964,150.2969 L773.1964,140.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="249.5264" x="518.67" y="157.3638">Simplest case (first account, all roles):</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="176.9727" x="518.67" y="172.4966">Draft &#8594; Published &#8594; Offline</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="149.4111" x="518.67" y="187.6294">One click, no approval.</t