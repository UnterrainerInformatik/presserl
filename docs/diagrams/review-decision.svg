<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="952px" preserveAspectRatio="none" style="width:820px;height:952px;background:#FFFFFF;" version="1.1" viewBox="0 0 820 952" width="820px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Sans-Serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="366.5361" x="226.0378" y="32.9951">Presserl - Approval chain (author A, section S)</text></g><ellipse cx="358.2051" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="154.8594" x="280.7754" y="92.2969"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="134.8594" x="290.7754" y="113.4355">A writes an article in S</text><path d="M521.6143,136.2656 L521.6143,190.2305 L501.6143,194.2305 L521.6143,198.2305 L521.6143,252.1953 A0,0 0 0 0 521.6143,252.1953 L799.6118,252.1953 A0,0 0 0 0 799.6118,252.1953 L799.6118,146.2656 L789.6118,136.2656 L521.6143,136.2656 A0,0 0 0 0 521.6143,136.2656" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M789.6118,136.2656 L789.6118,146.2656 L799.6118,146.2656 L789.6118,136.2656" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="58.4556" x="527.6143" y="153.3325">A level is</text><text fill="#000000" font-family="Sans-Serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="57.5732" x="590.2021" y="153.3325">skipped</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="35.1089" x="651.9077" y="153.3325">when</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="256.9976" x="527.6143" y="168.4653">&#8226; no account other than A holds its role</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="177.7026" x="535.8789" y="183.5981">(locked accounts count), or</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="230.5215" x="527.6143" y="198.731">&#8226; that level trusts A (section editor:</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="242.4424" x="535.8789" y="213.8638">per section; others newspaper-wide).</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="222.9043" x="527.6143" y="228.9966">Never skipped: the publisher level</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="120.2944" x="527.6143" y="244.1294">of a locked article.</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="286.8184" x="214.7959" y="163.2773"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="248.4609" x="224.7959" y="184.416">chain = levels above A's highest role in S</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="266.8184" x="224.7959" y="198.3848">(section editor &#8594; editor-in-chief &#8594; publisher)</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="134.2969" x="224.7959" y="212.3535">without skipped levels</text><polygon fill="#F1F1F1" points="320.9995,272.1953,395.4106,272.1953,407.4106,284.1953,395.4106,296.1953,320.9995,296.1953,308.9995,284.1953,320.9995,272.1953" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="74.4111" x="320.9995" y="288.0034">chain empty?</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="289.9912" y="281.6011">yes</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="407.4106" y="281.6011">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="118.7422" x="158.8625" y="306.1953"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="45.0879" x="168.8625" y="327.334">A clicks</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="49.8398" x="217.7649" y="327.334">Publish</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.0313" x="439.6609" y="306.1953"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="45.0879" x="449.6609" y="327.334">A clicks</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="48.1289" x="498.5632" y="327.334">Submit</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.3125" x="348.0203" y="404.1641"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="173.7363" x="358.0203" y="425.3027">waits for the lowest level left</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="145.998" x="358.0203" y="439.2715">(never published: status</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="70.5938" x="507.8328" y="439.2715">Submitted</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="4.043" x="578.4265" y="439.2715">;</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="280.3125" x="358.0203" y="453.2402">published/offline: status and live revision stay;</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="92.2266" x="358.0203" y="467.209">content frozen)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.8574" x="370.2478" y="500.0391"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="235.8574" x="380.2478" y="521.1777">one person &#8800; A holding this level's role</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="141.8789" x="380.2478" y="535.1465">or a higher one decides</text><polygon fill="#F1F1F1" points="475.5051,582.0117,520.8479,582.0117,532.8479,594.0117,520.8479,606.0117,475.5051,606.0117,463.5051,594.0117,475.5051,582.0117" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="45.3428" x="475.5051" y="597.8198">decision</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="31.4746" x="432.0305" y="591.4175">reject</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="45.2354" x="532.8479" y="591.4175">approve</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182.5039" x="307.6047" y="616.0117"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="162.5039" x="317.6047" y="637.1504">submission ends, note to A</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="115.1367" x="317.6047" y="651.1191">(never published &#8594;</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="34.9336" x="436.5559" y="651.1191">Draft</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="4.6816" x="471.4895" y="651.1191">)</text><ellipse cx="398.8567" cy="694.9492" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="398.8567" cy="694.9492" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.7754" x="510.1086" y="616.0117"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="124.6582" x="520.1086" y="637.1504">every level up to the</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="154.7754" x="520.1086" y="651.1191">approver's level is settled</text><polygon fill="#F1F1F1" points="498.1765,360.1641,510.1765,372.1641,498.1765,384.1641,486.1765,372.1641,498.1765,360.1641" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#F1F1F1" points="411.0332,725.9492,585.3198,725.9492,597.3198,738.7539,585.3198,751.5586,411.0332,751.5586,399.0332,738.7539,411.0332,725.9492" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="152.668" x="411.0332" y="736.1597">a staffed, non-trusting level</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="174.2866" x="411.0332" y="748.9644">above the approver's level left?</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="597.3198" y="736.1597">yes</text><polygon fill="#F1F1F1" points="358.2051,757.5586,370.2051,769.5586,358.2051,781.5586,346.2051,769.5586,358.2051,757.5586" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.5449" x="253.4326" y="801.5586"/><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="66.5684" x="263.4326" y="822.6973">Published</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="119.1621" x="333.8154" y="822.6973">(latest revision live)</text><path d="M15,845.5273 L15,931.1914 A0,0 0 0 0 15,931.1914 L327.2051,931.1914 A0,0 0 0 0 327.2051,931.1914 L327.2051,892.3594 L347.2051,888.3594 L327.2051,884.3594 L327.2051,855.5273 L317.2051,845.5273 L15,845.5273 A0,0 0 0 0 15,845.5273" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M317.2051,845.5273 L317.2051,855.5273 L327.2051,855.5273 L317.2051,845.5273" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="237.1738" x="21" y="862.5942">Solo: the first account holds all roles</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="235.2505" x="21" y="877.7271">&#8594; empty chain &#8594; published at once.</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="41.3486" x="21" y="892.8599">A may</text><text fill="#000000" font-family="Sans-Serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4341" x="66.481" y="892.8599">withdraw</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="167.8511" x="139.0474" y="892.8599">a submission at any time.</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="277.3545" x="21" y="907.9927">Levels are re-evaluated at every approval;</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="291.2051" x="21" y="923.1255">trust set later does not move a pending one.</text><ellipse cx="358.2051" cy="888.3594" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="358.2051" cy="888.3594" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="358.2051" x2="358.2051" y1="72.2969" y2="92.2969"/><polygon fill="#181818" points="354.2051,82.2969,358.2051,92.2969,362.2051,82.2969,358.2051,86.2969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="358.2051" x2="358.2051" y1="126.2656" y2="163.2773"/><polygon fill="#181818" points="354.2051,153.2773,358.2051,163.2773,362.2051,153.2773,358.2051,157.2773" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="498.1765" x2="498.1765" y1="480.0391" y2="500.0391"/><polygon fill="#181818" points="494.1765,490.0391,498.1765,500.0391,502.1765,490.0391,498.1765,494.0391" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="398.8567" x2="398.8567" y1="663.9492" y2="683.9492"/><polygon fill="#181818" points="394.8567,673.9492,398.8567,683.9492,402.8567,673.9492,398.8567,677.9492" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="463.5051" x2="398.8567" y1="594.0117" y2="594.0117"/><line style="stroke:#181818;stroke-width:1;" x1="398.8567" x2="398.8567" y1="594.0117" y2="616.0117"/><polygon fill="#181818" points="394.8567,606.0117,398.8567,616.0117,402.8567,606.0117,398.8567,610.0117" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="532.8479" x2="597.4963" y1="594.0117"