<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="897px" preserveAspectRatio="none" style="width:837px;height:897px;background:#FFFFFF;" version="1.1" viewBox="0 0 837 897" width="837px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Sans-Serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="366.5361" x="234.4199" y="32.9951">Presserl - Approval chain (author A, section S)</text></g><ellipse cx="352.8984" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="154.8594" x="275.4688" y="92.2969"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="134.8594" x="285.4688" y="113.4355">A writes an article in S</text><path d="M516.3076,141.9531 L516.3076,173.2188 L496.3076,177.2188 L516.3076,181.2188 L516.3076,212.4844 A0,0 0 0 0 516.3076,212.4844 L816.376,212.4844 A0,0 0 0 0 816.376,212.4844 L816.376,151.9531 L806.376,141.9531 L516.3076,141.9531 A0,0 0 0 0 516.3076,141.9531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M806.376,141.9531 L806.376,151.9531 L816.376,151.9531 L806.376,141.9531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="58.4556" x="522.3076" y="159.02">A level is</text><text fill="#000000" font-family="Sans-Serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="57.5732" x="584.8955" y="159.02">skipped</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="35.1089" x="646.6011" y="159.02">when</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="256.9976" x="522.3076" y="174.1528">&#8226; no account other than A holds its role</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="177.7026" x="530.5723" y="189.2856">(locked accounts count), or</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="279.0684" x="522.3076" y="204.4185">&#8226; someone of that level trusts A (planned).</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="286.8184" x="209.4893" y="146.2656"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="248.4609" x="219.4893" y="167.4043">chain = levels above A's highest role in S</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="266.8184" x="219.4893" y="181.373">(section editor &#8594; editor-in-chief &#8594; publisher)</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="134.2969" x="219.4893" y="195.3418">without skipped levels</text><polygon fill="#F1F1F1" points="315.6929,232.4844,390.104,232.4844,402.104,244.4844,390.104,256.4844,315.6929,256.4844,303.6929,244.4844,315.6929,232.4844" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="74.4111" x="315.6929" y="248.2925">chain empty?</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="284.6846" y="241.8901">yes</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="402.104" y="241.8901">no</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="118.7422" x="153.5559" y="266.4844"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="45.0879" x="163.5559" y="287.623">A clicks</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="49.8398" x="212.4583" y="287.623">Publish</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="117.0313" x="434.3542" y="266.4844"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="45.0879" x="444.3542" y="287.623">A clicks</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="48.1289" x="493.2566" y="287.623">Submit</text><rect fill="#F1F1F1" height="75.875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="300.3125" x="342.7136" y="364.4531"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="173.7363" x="352.7136" y="385.5918">waits for the lowest level left</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="145.998" x="352.7136" y="399.5605">(never published: status</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="70.5938" x="502.5261" y="399.5605">Submitted</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="4.043" x="573.1199" y="399.5605">;</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="280.3125" x="352.7136" y="413.5293">published/offline: status and live revision stay;</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="92.2266" x="352.7136" y="427.498">content frozen)</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.8574" x="364.9412" y="460.3281"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="235.8574" x="374.9412" y="481.4668">one person &#8800; A holding this level's role</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="141.8789" x="374.9412" y="495.4355">or a higher one decides</text><polygon fill="#F1F1F1" points="470.1985,542.3008,515.5413,542.3008,527.5413,554.3008,515.5413,566.3008,470.1985,566.3008,458.1985,554.3008,470.1985,542.3008" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="45.3428" x="470.1985" y="558.1089">decision</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="31.4746" x="426.7239" y="551.7065">reject</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="45.2354" x="527.5413" y="551.7065">approve</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182.5039" x="302.2981" y="576.3008"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="162.5039" x="312.2981" y="597.4395">submission ends, note to A</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="115.1367" x="312.2981" y="611.4082">(never published &#8594;</text><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="34.9336" x="431.2493" y="611.4082">Draft</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="4.6816" x="466.1829" y="611.4082">)</text><ellipse cx="393.55" cy="655.2383" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="393.55" cy="655.2383" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="174.7754" x="504.802" y="576.3008"/><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="124.6582" x="514.802" y="597.4395">every level up to the</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="154.7754" x="514.802" y="611.4082">approver's level is settled</text><polygon fill="#F1F1F1" points="492.8699,320.4531,504.8699,332.4531,492.8699,344.4531,480.8699,332.4531,492.8699,320.4531" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#F1F1F1" points="424.3401,686.2383,561.3997,686.2383,573.3997,699.043,561.3997,711.8477,424.3401,711.8477,412.3401,699.043,424.3401,686.2383" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="115.3979" x="424.3401" y="696.4487">a staffed level above</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="137.0596" x="424.3401" y="709.2534">the approver's level left?</text><text fill="#000000" font-family="Sans-Serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="573.3997" y="696.4487">yes</text><polygon fill="#F1F1F1" points="352.8984,717.8477,364.8984,729.8477,352.8984,741.8477,340.8984,729.8477,352.8984,717.8477" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="209.5449" x="248.126" y="761.8477"/><text fill="#000000" font-family="Sans-Serif" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="66.5684" x="258.126" y="782.9863">Published</text><text fill="#000000" font-family="Sans-Serif" font-size="12" lengthAdjust="spacing" textLength="119.1621" x="328.5088" y="782.9863">(latest revision live)</text><path d="M15,805.8164 L15,876.3477 A0,0 0 0 0 15,876.3477 L321.8984,876.3477 A0,0 0 0 0 321.8984,876.3477 L321.8984,845.082 L341.8984,841.082 L321.8984,837.082 L321.8984,815.8164 L311.8984,805.8164 L15,805.8164 A0,0 0 0 0 15,805.8164" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M311.8984,805.8164 L311.8984,815.8164 L321.8984,815.8164 L311.8984,805.8164" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="237.1738" x="21" y="822.8833">Solo: the first account holds all roles</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="235.2505" x="21" y="838.0161">&#8594; empty chain &#8594; published at once.</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="41.3486" x="21" y="853.1489">A may</text><text fill="#000000" font-family="Sans-Serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="68.4341" x="66.481" y="853.1489">withdraw</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="167.8511" x="139.0474" y="853.1489">a submission at any time.</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="277.1069" x="21" y="868.2817">Levels are re-evaluated at every approval.</text><ellipse cx="352.8984" cy="841.082" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="352.8984" cy="841.082" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="352.8984" x2="352.8984" y1="72.2969" y2="92.2969"/><polygon fill="#181818" points="348.8984,82.2969,352.8984,92.2969,356.8984,82.2969,352.8984,86.2969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="352.8984" x2="352.8984" 