<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="679px" preserveAspectRatio="none" style="width:1270px;height:679px;background:#FFFFFF;" version="1.1" viewBox="0 0 1270 679" width="1270px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="Sans-Serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="270.1494" x="496.758" y="22.9951">Presserl - Roles &amp; Responsibilities</text></g><!--class Operator--><g class="entity" data-qualified-name="Operator" data-source-line="8" id="ent0001"><rect fill="#EEEEEE" height="121.4531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="301.3926" x="654.52" y="45.4569"/><text fill="#000000" font-family="Sans-Serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="69.1992" x="770.6167" y="61.5955">&#171;technical&#187;</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="62.665" x="773.8838" y="77.4207">Operator</text><line style="stroke:#181818;stroke-width:0.5;" x1="655.52" x2="954.9126" y1="85.7225" y2="85.7225"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="281.1689" x="660.52" y="102.7176">parents / admin - outside the newsroom</text><line style="stroke:#181818;stroke-width:1;" x1="655.52" x2="954.9126" y1="110.0194" y2="110.0194"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="235.2656" x="660.52" y="127.0145">+create/lock accounts (Keycloak)</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="289.3926" x="660.52" y="143.3114">+emergency brake: take anything offline</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="216.8223" x="660.52" y="159.6082">+deployment, theme, backups</text></g><!--class Newspaper--><g class="entity" data-qualified-name="Newspaper" data-source-line="16" id="ent0002"><rect fill="#F1F1F1" height="66.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="184.0947" x="695.17" y="265.3769"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="78.5518" x="747.9415" y="283.372">Newspaper</text><line style="stroke:#181818;stroke-width:0.5;" x1="696.17" x2="878.2647" y1="291.6738" y2="291.6738"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="139.8359" x="701.17" y="308.6689">name, subtitle, logo</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="172.0947" x="701.17" y="324.9657">visibility: private | public</text></g><!--class Section--><g class="entity" data-qualified-name="Section" data-source-line="21" id="ent0003"><rect fill="#F1F1F1" height="66.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="213.0791" x="411.68" y="598.0469"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="52.0146" x="492.2122" y="616.042">Section</text><line style="stroke:#181818;stroke-width:0.5;" x1="412.68" x2="623.7591" y1="624.3438" y2="624.3438"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="201.0791" x="417.68" y="641.3389">e.g. Sports, Animals, Puzzles</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="126.4785" x="417.68" y="657.6357">default: "General"</text></g><!--class Publisher--><g class="entity" data-qualified-name="Publisher" data-source-line="26" id="ent0004"><rect fill="#FFF2CC" height="123.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="310.4297" x="7" y="44.2969"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="64.5176" x="129.9561" y="62.292">Publisher</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="316.4297" y1="70.5938" y2="70.5938"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="201.9063" x="13" y="87.5889">head of the newspaper (1..*)</text><line style="stroke:#181818;stroke-width:1;" x1="8" x2="316.4297" y1="94.8906" y2="94.8906"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="226.9463" x="13" y="111.8857">+publishes directly, everywhere</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="164.1514" x="13" y="128.1826">+takes anything offline</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="225.5176" x="13" y="144.4795">+creates sections, assigns roles</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="298.4297" x="13" y="160.7764">+reviews sections without a section editor</text></g><!--class Chief--><g class="entity" data-qualified-name="Chief" data-source-line="35" id="ent0005"><rect fill="#DAE8FC" height="107.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="252.6113" x="199.91" y="245.0769"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="97.665" x="277.3831" y="263.072">Section editor</text><line style="stroke:#181818;stroke-width:0.5;" x1="200.91" x2="451.5213" y1="271.3738" y2="271.3738"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="177.9258" x="205.91" y="288.3689">leads exactly one section</text><line style="stroke:#181818;stroke-width:1;" x1="200.91" x2="451.5213" y1="295.6706" y2="295.6706"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="240.6113" x="205.91" y="312.6657">+publishes directly in own section</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="234.165" x="205.91" y="328.9626">+reviews own section's reporters</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="203.376" x="205.91" y="345.2595">+takes offline in own section</text></g><!--class Reporter--><g class="entity" data-qualified-name="Reporter" data-source-line="43" id="ent0006"><rect fill="#D5E8D4" height="107.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="216.2441" x="410.09" y="413.5569"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="61.4072" x="487.5085" y="431.552">Reporter</text><line style="stroke:#181818;stroke-width:0.5;" x1="411.09" x2="625.3341" y1="439.8538" y2="439.8538"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="159.4893" x="416.09" y="456.8489">writes for 1..n sections</text><line style="stroke:#181818;stroke-width:1;" x1="411.09" x2="625.3341" y1="464.1506" y2="464.1506"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="204.2441" x="416.09" y="481.1457">+write drafts, upload images</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="59.8008" x="416.09" y="497.4426">+submit</text><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="179.6553" x="416.09" y="513.7395">+take own articles offline</text></g><!--class Reader--><g class="entity" data-qualified-name="Reader" data-source-line="51" id="ent0007"><rect fill="#F1F1F1" height="74.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="264.8955" x="990.77" y="68.7369"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="50.1758" x="1098.1299" y="86.732">Reader</text><line style="stroke:#181818;stroke-width:0.5;" x1="991.77" x2="1254.6655" y1="95.0337" y2="95.0337"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="252.8955" x="996.77" y="112.0289">only needed for private newspapers</text><line style="stroke:#181818;stroke-width:1;" x1="991.77" x2="1254.6655" y1="119.3306" y2="119.3306"/><text fill="#000000" font-family="Sans-Serif" font-size="14" lengthAdjust="spacing" textLength="171.7666" x="996.77" y="136.3257">+read published articles</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="68" id="ent0017"><path d="M352.75,70.9169 L352.75,102.1869 L317.89,106.1869 L352.75,110.1869 L352.75,141.4481 A0,0 0 0 0 352.75,141.4481 L619.6836,141.4481 A0,0 0 0 0 619.6836,141.4481 L619.6836,80.9169 L609.6836,70.9169 L352.75,70.9169 A0,0 0 0 0 352.75,70.9169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M609.6836,70.9169 L609.6836,80.9169 L619.6836,80.9169 L609.6836,70.9169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="67.501" x="358.75" y="87.9838">Hierarchy:</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="245.9336" x="358.75" y="103.1166">Publisher &gt; Section editor &gt; Reporter</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="238.894" x="358.75" y="118.2494">Every higher role may do everything</text><text fill="#000000" font-family="Sans-Serif" font-size="13" lengthAdjust="spacing" textLength="169.4951" x="358.75" y="133.3822">the roles below it may do.</text></g><!--link Operator to Newspaper--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="57" id="lnk8"><path codeLine="57" d="M799.54,167.2469 C796.49,199.5469 793.3198,233.169 790.7898,259.979" fill="none" id="Operator-to-Newspaper" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/