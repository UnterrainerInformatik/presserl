schema: spec-driven

context: |
  Multi-platform monorepo:
    - backend/  : Java, Quarkus, Maven. REST via JAX-RS (Quarkus REST), JSON via Jackson.
                  Reader = server-rendered HTML via Qute templates (front page, articles, print).
                  Tests: JUnit 5 + AssertJ, @QuarkusTest for integration tests.
    - admin/    : administration app, Compose Multiplatform (Kotlin, Gradle), Wasm web target
                  first, Android/iOS later. Talks to /api with bearer tokens.
                  Tests: Kotlin (kotlin.test, Compose UI tests where useful).
    - deploy/   : reference deployment + templates (INSTALL.md, compose, realm, .env.example, theme).
                  Staging deployment: ../presserl-deployment (presserl.unterrainer.info, public).
                  First public fork: ../alexpresse (alexpresse.net), a fork of the staging repo.
                  Deployment repos hold name, .env and theme only.
    - http/     : .http request files that exercise the backend REST API.
    - ai/       : memory, primer (ai/primer/endpoints.md = REST contract), open proposals.
  All repo content (code, comments, logs, docs, commits, OpenSpec artifacts) is English.
  Conventional commits.

rules:
  proposal:
    - State which platforms are affected (backend, reader, admin, deploy, docs) in the Impact section.
    - Include a Non-goals section.
  design:
    - When the REST contract changes, show the exact request/response shapes.
  tasks:
    - Group tasks by platform (Backend, Reader, Admin, Deploy, Contract/Docs, Verification).
    - Any REST contract change includes tasks for ai/primer/endpoints.md, the admin API client/DTOs, and .http files under http/.
    - Include test tasks for every behaviour change (JUnit/AssertJ for backend and reader, Kotlin tests for admin).
