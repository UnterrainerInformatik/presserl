schema: spec-driven

context: |
  Multi-platform monorepo:
    - backend/  : Java, Quarkus, Maven. REST via JAX-RS (Quarkus REST), JSON via Jackson.
                  Tests: JUnit 5 + AssertJ, @QuarkusTest for integration tests.
    - frontend/ : Vue 3 + TypeScript, Vite. Composition API with <script setup lang="ts">.
                  Tests: Vitest + Vue Test Utils.
    - http/     : .http request files that exercise the backend REST API.
    - ai/       : memory, primer (ai/primer/endpoints.md = REST contract), open proposals.
  All repo content (code, comments, logs, docs, commits, OpenSpec artifacts) is English.
  Conventional commits.

rules:
  proposal:
    - State which platforms are affected (backend, frontend, both) in the Impact section.
    - Include a Non-goals section.
  design:
    - When the REST contract changes, show the exact request/response shapes.
  tasks:
    - Group tasks by platform (Backend, Frontend, Contract/Docs, Verification).
    - Any REST contract change includes tasks for ai/primer/endpoints.md, the frontend API client/types, and .http files under http/.
    - Include test tasks for every behaviour change (JUnit/AssertJ for backend, Vitest for frontend).
